[theme]
# Base dark theme so Streamlit's own widgets render dark natively. The custom CSS
# in app/main.py layers on top of this rather than fighting a light theme.
base = "dark"
primaryColor = "#7C5CFF"
backgroundColor = "#070B1C"
secondaryBackgroundColor = "#0D1229"
textColor = "#E8ECFF"
font = "sans serif"
